name: Blazor WebAssembly auf GitHub Pages bereitstellen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: .NET SDK installieren
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: NuGet-Pakete wiederherstellen
        run: dotnet restore ./MySoundboard.csproj

      - name: Blazor WebAssembly veröffentlichen
        run: dotnet publish ./MySoundboard.csproj --configuration Release --output ./publish

      - name: Basis-Pfad für GitHub Pages setzen
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ "$REPOSITORY_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH="/"
          else
            BASE_PATH="/$REPOSITORY_NAME/"
          fi

          sed -i "s|<base href=\"/\" />|<base href=\"$BASE_PATH\" />|g" ./publish/wwwroot/index.html

      - name: Fallbackseite für Blazor-Routing erstellen
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      - name: Jekyll-Verarbeitung deaktivieren
        run: touch ./publish/wwwroot/.nojekyll

      - name: GitHub-Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Auf GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v4